# 数据导出：近几个自然月内的随访数据可直接下载（6 = 从当前月份往前半年，如 10 月可下载 4 月 1 日至今），更早的需提交申请
ra.export.free-months=6
# 导出申请发送到的邮箱（发邮件功能待实现，先只记录到 export_application 表）
ra.export.apply-mail-to=

# 疾病分型（血清学）判定用的参考范围上限 ULN：值 ≤ ULN 阴性，≤ 3×ULN 低滴度阳性，> 3×ULN 高滴度阳性
# 老数据没存各化验室的参考范围，统一用这里的值（待业务确认，见 docs/TODO.md）
ra.serology.rf-uln=20
ra.serology.ccp-uln=25

# 新建患者时写 patient_relation_doctor.research_type 的值：0 = 类风湿关节炎研究平台（2026-10-11 业务确认）；留空时新建患者会提示未配置、不写库
ra.patient.research-type=0
# 登录账号（测试期）：用户名:密码:医生ID，多个用逗号分隔；正式账号体系确定后替换
ra.auth.accounts=yanwenjing:ra2026:82394
server.servlet.session.timeout=12h
# 随访管理：最近一次随访（没有随访取建档日期）距今超过 N 个月算「疑似失访」，不计入随访计划、逾期和按期随访率
ra.followup.lost-months=24

